name: Movement policy tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run independent movement traces
        run: dotnet run --project .scripts/MaxPickupPolicyTests/MaxPickupPolicyTests.csproj -c Release
